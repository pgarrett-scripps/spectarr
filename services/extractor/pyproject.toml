[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectarr-extractor"
version = "0.1.0"
description = "Streaming mass spectrometry metadata extraction worker for Spectarr"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openmassspec = ["openmassspec"]

[project.scripts]
spectarr-extractor-worker = "spectarr_extractor.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spectarr_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
