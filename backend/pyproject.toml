[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spectarr"
version = "0.1.0"
description = "Self-hosted mass spectrometry data library"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.4,<4.15",
  "fastapi>=0.115,<0.142",
  "httpx>=0.27,<0.29",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
sdrf = ["sdrf-pipelines[ontology]>=0.1.5,<0.2"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
spectarr-server = "spectarr.runtime:main"
spectarr-backup = "spectarr.backup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spectarr"]

[tool.pytest.ini_options]
addopts = "-q --cov=spectarr --cov-report=term-missing:skip-covered --cov-fail-under=85"
testpaths = ["tests"]
