[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spectarr"
version = "0.2.0"
description = "Self-hosted mass spectrometry data library"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.4,<4.15",
  "fastapi>=0.121,<0.142",
  "httpx>=0.27,<0.29",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.32,<1",
  "sqlalchemy>=2.0,<3",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
sdrf = ["sdrf-pipelines[ontology]>=0.1.5,<0.2"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "pytest-timeout>=2.4,<3",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
]

[project.scripts]
spectarr-server = "spectarr.runtime:main"
spectarr-backup = "spectarr.backup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spectarr"]

[tool.pytest.ini_options]
addopts = "-q --cov=spectarr --cov-report=term-missing:skip-covered --cov-fail-under=85 -n 4 --dist loadscope --timeout=15"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/spectarr/locking.py", "src/spectarr/backup.py"]
follow_imports = "silent"
check_untyped_defs = true
