version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /services/agent
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/converter
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/extractor
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/mcp
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/webhooks
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dashboard-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
