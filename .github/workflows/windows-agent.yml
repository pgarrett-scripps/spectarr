name: Windows agent

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install ./services/agent pyinstaller==6.22.3
      - name: Test acquisition agent on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s services/agent/tests
          python -c "import spectarr_agent.windows_service"
          $parseErrors = @()
          Get-ChildItem services/agent/windows/*.ps1 | ForEach-Object {
            $parseTokens = $null
            $fileErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$fileErrors) | Out-Null
            $parseErrors += $fileErrors
          }
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors | Out-String)
          }
      - name: Build standalone agent executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name spectarr-agent --paths services/agent/src --distpath services/agent/windows/dist --workpath services/agent/windows/build services/agent/windows/entrypoint.py
          services/agent/windows/dist/spectarr-agent.exe --version
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = Get-Content VERSION -Raw
          $version = $version.Trim()
          $wix = Join-Path $env:WIX "bin"
          New-Item -ItemType Directory -Path services/agent/windows/output -Force | Out-Null
          & "$wix\candle.exe" -arch x64 "-dSpectarrVersion=$version" "-dAgentExecutable=$pwd\services\agent\windows\dist\spectarr-agent.exe" -ext WixUIExtension services/agent/windows/Product.wxs -out services/agent/windows/output/Product.wixobj
          if ($LASTEXITCODE -ne 0) {
            throw "WiX compilation failed"
          }
          & "$wix\light.exe" -b "$pwd\services\agent\windows" -ext WixUIExtension services/agent/windows/output/Product.wixobj -out "services/agent/windows/output/spectarr-agent-$version-windows-x64.msi"
          if ($LASTEXITCODE -ne 0) {
            throw "WiX linking failed"
          }
      - name: Test Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = (Resolve-Path "services/agent/windows/output/spectarr-agent-$version-windows-x64.msi").Path
          $install = Start-Process msiexec.exe -ArgumentList @("/i", "`"$installer`"", "/qn", "/norestart") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "MSI installation failed with exit code $($install.ExitCode)"
          }
          $installedAgent = Join-Path $env:ProgramFiles "Spectarr Agent\spectarr-agent.exe"
          if (-not (Test-Path -LiteralPath $installedAgent)) {
            throw "Installed agent executable was not found"
          }
          Get-Service -Name SpectarrAgent -ErrorAction Stop | Out-Null
          & $installedAgent --version
          $uninstall = Start-Process msiexec.exe -ArgumentList @("/x", "`"$installer`"", "/qn", "/norestart") -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) {
            throw "MSI uninstallation failed with exit code $($uninstall.ExitCode)"
          }
          if (Get-Service -Name SpectarrAgent -ErrorAction SilentlyContinue) {
            throw "SpectarrAgent service remained after uninstall"
          }
      - name: Create installer checksum
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = "services/agent/windows/output/spectarr-agent-$version-windows-x64.msi"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content "$installer.sha256" -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spectarr-windows-agent
          path: |
            services/agent/windows/output/spectarr-agent-*.msi
            services/agent/windows/output/spectarr-agent-*.msi.sha256
