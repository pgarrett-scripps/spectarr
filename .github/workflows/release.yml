name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: spectarr-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]
          then
            python3 scripts/check_version.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_version.py
          fi

  image:
    needs: [validate, test]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned dependencies
        id: dependencies
        shell: bash
        run: |
          source DEPENDENCIES.env
          echo "msconvert_repository=$MSCONVERT_CLI_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "msconvert_ref=$MSCONVERT_CLI_REF" >> "$GITHUB_OUTPUT"
          echo "mzmlpy_repository=$MZMLPY_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "mzmlpy_ref=$MZMLPY_REF" >> "$GITHUB_OUTPUT"
          echo "spxtacular_repository=$SPXTACULAR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "spxtacular_ref=$SPXTACULAR_REF" >> "$GITHUB_OUTPUT"
      - name: Check out MSCLI
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.dependencies.outputs.msconvert_repository }}
          ref: ${{ steps.dependencies.outputs.msconvert_ref }}
          path: distribution/msconvert-cli
      - name: Check out mzmlpy
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.dependencies.outputs.mzmlpy_repository }}
          ref: ${{ steps.dependencies.outputs.mzmlpy_ref }}
          path: distribution/mzmlpy
      - name: Check out Spxtacular
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.dependencies.outputs.spxtacular_repository }}
          ref: ${{ steps.dependencies.outputs.spxtacular_ref }}
          path: distribution/spxtacular
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        name: Resolve image names
        shell: bash
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          version=$(tr -d '[:space:]' < VERSION)
          echo "image=${REGISTRY}/${owner}/spectarr" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.image }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-contexts: |
            msconvert_cli=./distribution/msconvert-cli
            mzmlpy_source=./distribution/mzmlpy
            spxtacular_source=./distribution/spxtacular
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  bundle:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build acquisition agent wheel
        run: python -m pip wheel --no-deps --wheel-dir release/dist services/agent
      - name: Build release bundle
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p release/bundle
          cp release/compose.yaml release/compose.backups.yaml release/.env.example release/README.md release/bundle/
          cp release/dist/*.whl release/bundle/
          mkdir -p release/bundle/scripts release/bundle/examples
          cp scripts/backup.sh scripts/verify-backup.sh scripts/restore-test.sh scripts/smoke_test.py scripts/sqlite-soak.py scripts/vendor-acceptance.py scripts/release-rehearsal.sh release/bundle/scripts/
          cp examples/demo.mgf release/bundle/examples/
          cp VERSION CHANGELOG.md SECURITY.md LICENSE NOTICE DEPENDENCIES.env constraints.txt release/bundle/
          cp docs/release-checklist.md release/bundle/
          cp docs/reliability-and-recovery.md docs/backup-integration.md release/bundle/
          tar -C release/bundle -czf "release/spectarr-${version}.tar.gz" .
          (
            cd release
            sha256sum "spectarr-${version}.tar.gz" > "spectarr-${version}.tar.gz.sha256"
          )
      - uses: actions/upload-artifact@v7
        with:
          name: spectarr-release-bundle
          path: |
            release/spectarr-*.tar.gz
            release/spectarr-*.sha256
            release/compose.yaml

  windows-agent:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install ./services/agent pyinstaller==6.20.0
      - name: Test acquisition agent on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s services/agent/tests
          python -c "import spectarr_agent.windows_service"
          $parseErrors = @()
          Get-ChildItem services/agent/windows/*.ps1 | ForEach-Object {
            $parseTokens = $null
            $fileErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$fileErrors) | Out-Null
            $parseErrors += $fileErrors
          }
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors | Out-String)
          }
      - name: Build standalone agent executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name spectarr-agent --paths services/agent/src --distpath services/agent/windows/dist --workpath services/agent/windows/build services/agent/windows/entrypoint.py
          services/agent/windows/dist/spectarr-agent.exe --version
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = Get-Content VERSION -Raw
          $version = $version.Trim()
          $wix = Join-Path $env:WIX "bin"
          New-Item -ItemType Directory -Path services/agent/windows/output -Force | Out-Null
          & "$wix\candle.exe" -arch x64 "-dSpectarrVersion=$version" "-dAgentExecutable=$pwd\services\agent\windows\dist\spectarr-agent.exe" -ext WixUIExtension services/agent/windows/Product.wxs -out services/agent/windows/output/Product.wixobj
          if ($LASTEXITCODE -ne 0) {
            throw "WiX compilation failed"
          }
          & "$wix\light.exe" -b "$pwd\services\agent\windows" -ext WixUIExtension services/agent/windows/output/Product.wixobj -out "services/agent/windows/output/spectarr-agent-$version-windows-x64.msi"
          if ($LASTEXITCODE -ne 0) {
            throw "WiX linking failed"
          }
      - name: Test Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = (Resolve-Path "services/agent/windows/output/spectarr-agent-$version-windows-x64.msi").Path
          $install = Start-Process msiexec.exe -ArgumentList @("/i", "`"$installer`"", "/qn", "/norestart") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "MSI installation failed with exit code $($install.ExitCode)"
          }
          $installedAgent = Join-Path $env:ProgramFiles "Spectarr Agent\spectarr-agent.exe"
          if (-not (Test-Path -LiteralPath $installedAgent)) {
            throw "Installed agent executable was not found"
          }
          Get-Service -Name SpectarrAgent -ErrorAction Stop | Out-Null
          & $installedAgent --version
          $uninstall = Start-Process msiexec.exe -ArgumentList @("/x", "`"$installer`"", "/qn", "/norestart") -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) {
            throw "MSI uninstallation failed with exit code $($uninstall.ExitCode)"
          }
          if (Get-Service -Name SpectarrAgent -ErrorAction SilentlyContinue) {
            throw "SpectarrAgent service remained after uninstall"
          }
      - name: Create installer checksum
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = "services/agent/windows/output/spectarr-agent-$version-windows-x64.msi"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content "$installer.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: spectarr-windows-agent
          path: |
            services/agent/windows/output/spectarr-agent-*.msi
            services/agent/windows/output/spectarr-agent-*.msi.sha256

  smoke:
    needs: [image, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spectarr-release-bundle
          path: candidate
      - name: Verify and extract candidate bundle
        working-directory: candidate
        run: |
          sha256sum --check spectarr-*.tar.gz.sha256
          mkdir install
          tar -C install -xzf spectarr-*.tar.gz
      - name: Rehearse installation, ingestion, backup, and restore
        env:
          SPECTARR_IMAGE_REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        working-directory: candidate/install
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          SPECTARR_IMAGE="${REGISTRY}/${owner}/spectarr" scripts/release-rehearsal.sh

  promote:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [smoke, windows-agent, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested digest
        env:
          CANDIDATE_IMAGE: ${{ needs.image.outputs.image }}
          CANDIDATE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          docker buildx imagetools create \
            --tag "$CANDIDATE_IMAGE:$version" \
            --tag "$CANDIDATE_IMAGE:latest" \
            "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"

  publish:
    needs: [promote]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spectarr-release-bundle
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: spectarr-windows-agent
          path: release
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          body: |
            Windows note: The acquisition-agent installer is unsigned. Windows may display an unknown-publisher warning during installation.
          files: |
            release/compose.yaml
            release/spectarr-*.tar.gz
            release/spectarr-*.sha256
            release/spectarr-agent-*.msi
            release/spectarr-agent-*.msi.sha256
