name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: spectarr-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]
          then
            python3 scripts/check_version.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_version.py
          fi

  image:
    needs: [validate, test]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve pinned dependencies
        id: dependencies
        shell: bash
        run: |
          source DEPENDENCIES.env
          echo "msconvert_repository=$MSCONVERT_CLI_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "msconvert_ref=$MSCONVERT_CLI_REF" >> "$GITHUB_OUTPUT"
          echo "mzmlpy_repository=$MZMLPY_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "mzmlpy_ref=$MZMLPY_REF" >> "$GITHUB_OUTPUT"
          echo "spxtacular_repository=$SPXTACULAR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "spxtacular_ref=$SPXTACULAR_REF" >> "$GITHUB_OUTPUT"
      - name: Check out MSCLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.dependencies.outputs.msconvert_repository }}
          ref: ${{ steps.dependencies.outputs.msconvert_ref }}
          path: distribution/msconvert-cli
      - name: Check out mzmlpy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.dependencies.outputs.mzmlpy_repository }}
          ref: ${{ steps.dependencies.outputs.mzmlpy_ref }}
          path: distribution/mzmlpy
      - name: Check out Spxtacular
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.dependencies.outputs.spxtacular_repository }}
          ref: ${{ steps.dependencies.outputs.spxtacular_ref }}
          path: distribution/spxtacular
      - name: Apply pinned converter correction
        run: git -C distribution/msconvert-cli apply "$GITHUB_WORKSPACE/release/dependency-patches/msconvert-cli-sage.patch"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        name: Resolve image names
        shell: bash
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          version=$(tr -d '[:space:]' < VERSION)
          echo "image=${REGISTRY}/${owner}/spectarr" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.image }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-contexts: |
            msconvert_cli=./distribution/msconvert-cli
            mzmlpy_source=./distribution/mzmlpy
            spxtacular_source=./distribution/spxtacular
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  bundle:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Build acquisition agent wheel
        run: python -m pip wheel --no-deps --wheel-dir release/dist services/agent
      - name: Build release bundle
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          mkdir -p release/bundle
          cp release/compose.yaml release/compose.backups.yaml release/compose.native.yaml release/.env.example release/README.md release/bundle/
          cp release/dist/*.whl release/bundle/
          mkdir -p release/bundle/scripts release/bundle/examples
          cp scripts/backup.sh scripts/verify-backup.sh scripts/restore-test.sh scripts/smoke_test.py scripts/sqlite-soak.py scripts/vendor-acceptance.py scripts/agent-acceptance.py scripts/scientific-acceptance.py scripts/maintenance-acceptance.py scripts/release-rehearsal.sh release/bundle/scripts/
          cp examples/demo.mgf release/bundle/examples/
          cp VERSION CHANGELOG.md SECURITY.md LICENSE NOTICE DEPENDENCIES.env constraints.txt release/bundle/
          cp docs/release-checklist.md release/bundle/
          cp docs/reliability-and-recovery.md docs/backup-integration.md release/bundle/
          cp services/converter/README.md release/bundle/native-conversion.md
          cp release/notes.md docs/release-0.5.0.md docs/acceptance-0.5.0.json release/bundle/
          cp docs/getting-started.md docs/data-and-storage.md release/bundle/
          cp docs/external-inventory.md docs/agent-file-discovery.md docs/online-dataset-import.md docs/latest-dependency-migration-2026-09-25.md release/bundle/
          tar -C release/bundle -czf "release/spectarr-${version}.tar.gz" .
          (
            cd release
            sha256sum "spectarr-${version}.tar.gz" > "spectarr-${version}.tar.gz.sha256"
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spectarr-release-bundle
          path: |
            release/spectarr-*.tar.gz
            release/spectarr-*.sha256
            release/compose.yaml

  windows-agent:
    needs: validate
    uses: ./.github/workflows/windows-agent.yml

  smoke:
    needs: [image, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spectarr-release-bundle
          path: candidate
      - name: Verify and extract candidate bundle
        working-directory: candidate
        run: |
          sha256sum --check spectarr-*.tar.gz.sha256
          mkdir install
          tar -C install -xzf spectarr-*.tar.gz
      - name: Rehearse installation, ingestion, backup, and restore
        env:
          SPECTARR_IMAGE_REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        working-directory: candidate/install
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          SPECTARR_IMAGE="${REGISTRY}/${owner}/spectarr" scripts/release-rehearsal.sh

  promote:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [smoke, windows-agent, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested digest
        env:
          CANDIDATE_IMAGE: ${{ needs.image.outputs.image }}
          CANDIDATE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          docker buildx imagetools create \
            --tag "$CANDIDATE_IMAGE:$version" \
            --tag "$CANDIDATE_IMAGE:latest" \
            "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"

  publish:
    needs: [promote]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spectarr-release-bundle
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spectarr-windows-agent
          path: release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release/notes.md
          files: |
            release/compose.yaml
            release/spectarr-*.tar.gz
            release/spectarr-*.sha256
            release/spectarr-agent-*.msi
            release/spectarr-agent-*.msi.sha256
